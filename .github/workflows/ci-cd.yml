name: CI/CD Pipeline - WebRioJaneiro

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Job 1: Audit & Quality Gates (Frontend + QA)
  audit-and-test:
    name: 🧪 Quality Gates & Automated Audits
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🎨 Run Frontend Developer Audit
        run: python scripts/frontend_audit.py

      - name: 🛡️ Run QA Engineer Audit (Off-line Check)
        run: python scripts/qa_audit.py
        continue-on-error: true

  # Job 2: Validate Docker Image Build
  docker-build:
    name: 🐳 Docker Container Build Check
    runs-on: ubuntu-latest
    needs: audit-and-test

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔨 Build Docker Image
        run: docker build -t web-rio-janeiro:test .

  # Job 3: Automated Deployment to GitHub Pages (Main Branch Only)
  deploy-github-pages:
    name: 🚀 Deploy to GitHub Pages (Production)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [audit-and-test, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: 'pages'
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload Static Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
